<svg fill="none" viewBox="0 0 900 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Fira Code', 'Segoe UI', monospace;
      font-size: 16px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Canvas with Rounded Corners -->
  <rect width="900" height="220" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="40" r="80" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="750" cy="80" r="100" fill="#818cf8" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Wave Path at Bottom -->
  <path d="M0 180 C 150 160, 300 200, 450 185 C 600 170, 750 205, 900 180 L 900 220 L 0 220 Z" fill="url(#waveGradient)" fill-opacity="0.4" />
  <path d="M0 190 C 200 175, 400 205, 600 190 C 750 180, 850 200, 900 195 L 900 220 L 0 220 Z" fill="url(#waveGradient)" fill-opacity="0.6" />

  <!-- Name / Title -->
  <text x="50%" y="85" text-anchor="middle" class="title">
    Sakariyah Abdulkadir Opeyemi
  </text>

  <!-- Subtitle / Roles -->
  <text x="50%" y="125" text-anchor="middle" class="subtitle">
    Software Engineer • Data Scientist • Backend &amp; Database Developer
  </text>

  <!-- Key Pillars / Focus Tags -->
  <text x="50%" y="155" text-anchor="middle" class="tag">
    Java (Spring Boot)  •  Python (FastAPI)  •  MySQL Workbench  •  Data Science
  </text>
</svg>
